<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DrewShare</title>
<meta name="description" content="Passa file da un dispositivo all'altro. Cifrati end-to-end, originali intatti, cancellati da soli.">
<meta name="theme-color" content="#0b0a09">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DrewShare">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<div class="safelight" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="#/" data-i18n-attr="aria-label:app.brandAria">
    <svg viewBox="0 0 64 64" width="21" height="21" aria-hidden="true" class="mark">
      <g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round">
        <circle cx="32" cy="32" r="22"/>
        <path d="M32 21 V14.5"/>
        <path d="M41.53 37.5 L47.15 40.75"/>
        <path d="M22.47 37.5 L16.85 40.75"/>
      </g>
      <circle cx="32" cy="32" r="6" fill="currentColor"/>
    </svg>
    <span>DrewShare</span>
  </a>
  <div class="topbar-end">
    <span class="tag" data-i18n="app.tag"></span>
    <div class="lang" id="lang" role="group" data-i18n-attr="aria-label:app.langAria"></div>
  </div>
</header>

<main id="app">

  <!-- ------------------------------------------------------------ home -->
  <section class="view" id="view-home">
    <div class="hero">
      <h1 data-i18n-html="home.title"></h1>
      <p class="lede" data-i18n="home.lede"></p>
    </div>

    <section class="recents" id="recents" hidden>
      <span class="recents-label" data-i18n="recents.h"></span>
      <div class="recents-list" id="recents-list"></div>
      <small class="recents-note" data-i18n="recents.note"></small>
    </section>

    <div class="panes">
      <section class="pane pane-create">
        <span class="pane-num">01</span>
        <h2 data-i18n="home.create.h"></h2>
        <p data-i18n="home.create.p"></p>
        <div class="ttl" id="ttl" role="radiogroup" data-i18n-attr="aria-label:home.create.ttlAria"></div>
        <button class="btn primary" id="btn-create" type="button">
          <span data-i18n="home.create.btn"></span>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </section>

      <section class="pane pane-join">
        <span class="pane-num">02</span>
        <h2 data-i18n="home.join.h"></h2>
        <p data-i18n="home.join.p"></p>
        <div class="code-input" id="code-input" role="group" data-i18n-attr="aria-label:home.join.codeAria"></div>
        <button class="btn" id="btn-join" type="button" disabled>
          <span data-i18n="home.join.btn"></span>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </section>
    </div>

    <ul class="facts">
      <li>
        <h3 data-i18n="facts.1.h"></h3>
        <p data-i18n="facts.1.p"></p>
      </li>
      <li>
        <h3 data-i18n="facts.2.h"></h3>
        <p data-i18n="facts.2.p"></p>
      </li>
      <li>
        <h3 data-i18n="facts.3.h"></h3>
        <p data-i18n="facts.3.p"></p>
      </li>
    </ul>
  </section>

  <!-- ------------------------------------------------------------ room -->
  <section class="view" id="view-room" hidden>
    <div class="room-head">
      <div class="room-id">
        <span class="label" data-i18n="room.codeLabel"></span>
        <div class="room-code" id="room-code">&nbsp;</div>
      </div>
      <div class="room-actions">
        <button class="btn ghost" id="btn-copy-code" type="button" data-i18n="room.copyCode"></button>
        <button class="btn ghost" id="btn-copy-link" type="button" data-i18n="room.copyLink"></button>
        <button class="btn ghost danger" id="btn-leave" type="button" data-i18n="room.leave"></button>
      </div>
    </div>

    <div class="timer">
      <div class="timer-track"><i id="timer-fill"></i></div>
      <span id="timer-text" class="timer-text">&nbsp;</span>
    </div>

    <label class="drop" id="drop">
      <input type="file" id="file-input" multiple>
      <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
        <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <strong data-i18n="drop.title"></strong>
      <span data-i18n="drop.sub"></span>
      <small data-i18n="drop.note"></small>
    </label>

    <section class="queue" id="queue" hidden aria-live="polite"></section>

    <section class="files">
      <div class="files-head">
        <h2><span data-i18n="files.h"></span> <span class="count" id="file-count"></span></h2>
        <button class="btn ghost" id="btn-zip" type="button" hidden data-i18n="files.zip"></button>
      </div>
      <p class="empty" id="empty" data-i18n="files.empty"></p>
      <div class="grid" id="grid"></div>
    </section>
  </section>

</main>

<footer class="foot">
  <span>DrewShare</span>
  <span class="sep">&middot;</span>
  <span data-i18n="foot.storage"></span>
</footer>

<div class="viewer" id="viewer" hidden>
  <div class="viewer-bar">
    <div class="viewer-title">
      <span class="viewer-name" id="viewer-name"></span>
      <span class="viewer-meta" id="viewer-meta"></span>
    </div>
    <div class="viewer-tools">
      <button class="btn ghost tiny" id="viewer-download" type="button" data-i18n="viewer.download"></button>
      <button class="btn ghost tiny" id="viewer-close" type="button" data-i18n="viewer.close"></button>
    </div>
  </div>

  <div class="viewer-stage" id="viewer-stage"></div>

  <button class="viewer-nav prev" id="viewer-prev" type="button" data-i18n-attr="aria-label:viewer.prev">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="viewer-nav next" id="viewer-next" type="button" data-i18n-attr="aria-label:viewer.next">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
